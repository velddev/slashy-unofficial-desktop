<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The email is untrusted: nothing loads from the internet (no tracking pixels), and its frame can't run scripts
     (sandbox without allow-scripts; allow-same-origin only so this page can size the frame to its content). -->
<meta http-equiv="Content-Security-Policy" content="script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src 'none'; connect-src 'none'; object-src 'none'">
<title>Email</title>
<style>
  /* Slashy's tokens; the real values arrive with the email (its current theme), these are its dark defaults. */
  :root {
    --background: #191919; --foreground: #d3d3d3; --foreground-strong: #ebebeb; --foreground-secondary: #a8a8a8;
    --foreground-muted: #a8a8a8; --surface: #202020; --surface-hover: #282828; --border: #ffffff0e;
    --border-default: #444; --border-strong: #555; --accent: #7c8af0; --bg-hover: #ffffff0f;
    --font: ui-sans-serif, system-ui, "Segoe UI", sans-serif, "Segoe UI Emoji";
  }
  html { color-scheme: dark; }
  html.light { color-scheme: light; }
  body { margin: 0; background: var(--background); color: var(--foreground); font: 14px/1.5 var(--font); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 10px; border: 3px solid var(--background); }
  ::-webkit-scrollbar-track { background: transparent; }

  main { max-width: 760px; margin: 0 auto; padding: 20px 32px 48px; }
  .bar { display: flex; justify-content: flex-end; gap: 4px; margin-bottom: 12px; }
  button { font: inherit; font-size: 13px; color: var(--foreground-secondary); background: transparent; border: 0; border-radius: 8px;
    padding: 6px 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  button:hover { background: var(--bg-hover); color: var(--foreground-strong); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent); }
  button.primary { background: var(--border-default); color: var(--foreground-strong); font-weight: 500; }
  button.primary:hover { background: var(--border-strong); }
  svg { flex: none; }

  h1 { font-size: 22px; line-height: 1.3; font-weight: 600; color: var(--foreground-strong); margin: 0 0 18px; overflow-wrap: anywhere; }
  .sender { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: var(--surface-hover); color: var(--foreground-strong); font-weight: 600; font-size: 15px; }
  .who { min-width: 0; flex: 1; }
  .name { color: var(--foreground-strong); font-weight: 600; }
  .address, .date, .to, .note { color: var(--foreground-muted); font-size: 13px; }
  .address { margin-left: 6px; }
  .to { overflow-wrap: anywhere; }
  .date { white-space: nowrap; align-self: flex-start; padding-top: 2px; }
  .note { margin-top: 14px; }

  .attachments { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
  .attachments:empty { display: none; }
  .card { width: 200px; border: 0.5px solid var(--border-default); border-radius: 12px; overflow: hidden; background: var(--surface);
    padding: 0; display: block; text-align: left; color: inherit; }
  .card:hover { background: var(--surface-hover); color: inherit; }
  .card .preview { height: 96px; display: grid; place-items: center; color: var(--foreground-muted); background: var(--background); }
  .card .preview span { display: block; text-align: center; font-size: 11px; text-transform: uppercase; margin-top: 4px; }
  .card .meta { display: flex; align-items: center; gap: 6px; padding: 8px 10px; }
  .card .fname { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; color: var(--foreground-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .fsize { font-size: 11px; color: var(--foreground-muted); }

  .body { margin-top: 24px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--foreground); }
  .text a { color: var(--accent); }
  iframe { display: block; width: 100%; border: 0; height: 0; }
  iframe.paper { background: #fff; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <div class="bar">
    <button id="save" title="Save this email as an .eml file">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>Save
    </button>
    <button id="reply" class="primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 14-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v5"/></svg>Reply in Slashy
    </button>
  </div>
  <h1 id="subject"></h1>
  <div class="sender">
    <div class="avatar" id="avatar"></div>
    <div class="who">
      <div><span class="name" id="name"></span><span class="address" id="address"></span></div>
      <div class="to" id="to"></div>
    </div>
    <div class="date" id="date"></div>
  </div>
  <div class="attachments" id="attachments"></div>
  <div class="note" id="note" hidden>Images from the internet are hidden.</div>
  <div class="body" id="body"></div>
</main>
<script type="module">
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  const list = (x) => [x].flat().filter(Boolean)
  const person = (a) => a?.name || a?.address || ''
  const size = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`)
  const ext = (name) => (name?.match(/\.([a-z0-9]{1,5})$/i)?.[1] ?? 'file').toLowerCase()
  const FILE_ICON = '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg>'
  const DOWNLOAD_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v8m-4-4 4 4 4-4"/></svg>'

  // Elements by id, looked up explicitly (implicit globals collide: `name` is window.name).
  const [subject, avatar, senderName, address, to, date, attachments, reply, save, note, body] = ['subject', 'avatar', 'name', 'address', 'to', 'date', 'attachments', 'reply', 'save', 'note', 'body'].map((id) => document.getElementById(id))

  const m = await eml.get()

  // Slashy's current theme.
  for (const [name, value] of Object.entries(m.theme ?? {})) document.documentElement.style.setProperty(name, value)
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--background').trim()
  const light = /^#?(f|e)/i.test(bg.replace('#', '')) // Slashy's light background is #fff
  document.documentElement.classList.toggle('light', light)

  // Header
  document.title = m.subject || '(no subject)'
  subject.textContent = document.title
  const from = list(m.from)[0]
  avatar.textContent = (person(from) || '?').trim()[0].toUpperCase()
  senderName.textContent = person(from)
  if (from?.name && from?.address) address.textContent = from.address
  const recipients = [...list(m.to), ...list(m.cc)].map(person).filter(Boolean)
  to.textContent = recipients.length ? `to ${recipients.join(', ')}` : ''
  if (m.date) date.textContent = new Date(m.date).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })

  // Attachments, as cards like Slashy's.
  m.attachments.forEach((a, i) => {
    const card = document.createElement('button')
    card.className = 'card'
    card.title = `Save ${a.filename ?? 'attachment'}`
    card.innerHTML = `<div class="preview"><div>${FILE_ICON}<span>.${esc(ext(a.filename))}</span></div></div>
      <div class="meta"><div style="flex:1;min-width:0"><div class="fname">${esc(a.filename ?? 'attachment')}</div><div class="fsize">${size(a.size)}</div></div>${DOWNLOAD_ICON}</div>`
    card.onclick = () => eml.save(i)
    attachments.append(card)
  })

  reply.onclick = () => eml.reply()
  save.onclick = () => eml.saveOriginal()

  // Body. Plain text renders in the theme. HTML renders in a sandboxed frame: emails that set their own colours or
  // backgrounds get a white "paper" card (they're designed for one); the rest take the theme's text colour.
  if (!m.html) {
    const text = document.createElement('div')
    text.className = 'text'
    text.innerHTML = esc(m.text ?? '').replace(/https?:\/\/[^\s<]+/g, (u) => `<a href="${u}" target="_blank">${u}</a>`)
    body.append(text)
  } else {
    const styled = /bgcolor|background(-color)?\s*:|[^-]color\s*:/i.test(m.html)
    const remote = /<img[^>]+src=["']?https?:/i.test(m.html)
    note.hidden = !remote
    const frame = document.createElement('iframe')
    frame.setAttribute('sandbox', 'allow-same-origin allow-popups allow-popups-to-escape-sandbox')
    if (styled) frame.className = 'paper'
    const base = styled
      ? 'body{margin:16px;font:14px/1.5 sans-serif}'
      : `html{color-scheme:${light ? 'light' : 'dark'}}body{margin:0;color:${getComputedStyle(document.body).color};font:14px/1.6 ${getComputedStyle(document.body).fontFamily}}a{color:${getComputedStyle(document.documentElement).getPropertyValue('--accent')}}`
    frame.srcdoc = `<base target="_blank"><style>${base}img[src^="http"]{display:none}</style>${m.html}`
    // One page scroll, like Slashy: the frame takes its content's height.
    const fit = () => frame.contentDocument && (frame.style.height = `${frame.contentDocument.documentElement.scrollHeight}px`)
    frame.onload = () => {
      fit()
      new ResizeObserver(fit).observe(frame.contentDocument.body)
    }
    body.append(frame)
  }
</script>
</body>
</html>
